<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>KFB Tablet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #e9edf2; --bar: #0f172a; --bar-text: #e2e8f0; --panel: #ffffff; --text: #0f172a; --muted: #64748b;
    --accent: #2563eb; --ok: #16a34a; --err: #dc2626; --warn: #d97706; --border: #cbd5e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); user-select: none; -webkit-user-select: none;
               font-family: "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
  button:disabled { opacity: .45; }

  #bar { background: var(--bar); color: var(--bar-text); display: flex; align-items: center; gap: 10px;
         padding: 8px 12px; flex-wrap: wrap; }
  #titlu { font-weight: 700; font-size: 20px; margin-right: 6px; }
  .pill { border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; background: #334155; }
  .pill.on { background: var(--ok); color: #fff; }
  .pill.off { background: #475569; color: #e2e8f0; }
  #btnConn { background: var(--accent); color: #fff; font-weight: 700; }
  #btnPm { background: #334155; color: #fff; font-weight: 700; }
  #btnPm.on { background: #f59e0b; color: #111827; }
  #btnVal { background: var(--ok); color: #fff; font-weight: 800; font-size: 18px; }
  #spatiu { flex: 1; }
  #btnMeniu { background: #334155; color: #fff; font-size: 20px; padding: 8px 14px; }

  #banner { min-height: 54px; padding: 10px 14px; font-size: 20px; font-weight: 700; display: flex;
            align-items: center; gap: 10px; background: #fff; border-bottom: 1px solid var(--border); }
  #banner.ok { background: #dcfce7; color: #14532d; }
  #banner.err { background: #fee2e2; color: #7f1d1d; }
  #banner.warn { background: #fef3c7; color: #78350f; }
  #banner.info { background: #fff; color: var(--text); }

  #zona { flex: 1; position: relative; overflow: hidden; touch-action: none; background: #cbd5e1; }
  #desen { width: 100%; height: 100%; display: block; }
  #gol { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         text-align: center; padding: 30px; font-size: 20px; color: var(--muted); }
  .spot circle.c { stroke-width: 3; vector-effect: non-scaling-stroke; }
  .spot text { font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 4px; fill: #0f172a;
               vector-effect: non-scaling-stroke; pointer-events: none; }
  .ascuns-nume .spot text.nume { display: none; }
  .st-F circle.c { fill: rgba(255,255,255,.55); stroke: #2563eb; stroke-dasharray: 6 4; }
  .st-W circle.c { fill: #fbbf24; stroke: #b45309; animation: puls 1s infinite; }
  .st-R circle.c { fill: #86efac; stroke: #15803d; }
  .st-O circle.c { fill: #22c55e; stroke: #14532d; }
  .st-P circle.c { fill: #15803d; stroke: #052e16; }
  .st-X circle.c { fill: #94a3b8; stroke: #334155; }
  .st-N circle.c { fill: #e2e8f0; stroke: #64748b; stroke-dasharray: 3 3; }
  .st-L circle.c { fill: #facc15; stroke: #a16207; animation: puls .5s infinite; }
  .st-U circle.c { fill: rgba(255,255,255,.4); stroke: #64748b; stroke-dasharray: 2 4; }
  .ales circle.c { stroke: #db2777 !important; stroke-width: 6 !important; stroke-dasharray: none !important; }
  @keyframes puls { 50% { opacity: .35; } }

  #legenda { position: absolute; left: 8px; bottom: 8px; background: rgba(255,255,255,.92); border-radius: 10px;
             padding: 6px 10px; font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 90px); }
  #legenda span { display: inline-flex; align-items: center; gap: 4px; }
  #legenda i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #334155; }
  #btnFit { position: absolute; right: 10px; bottom: 10px; background: #fff; color: var(--text);
            box-shadow: 0 2px 6px rgba(0,0,0,.2); font-weight: 700; }

  #foaie { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-radius: 16px 16px 0 0;
           box-shadow: 0 -4px 18px rgba(0,0,0,.25); padding: 14px 16px 18px; transform: translateY(110%);
           transition: transform .18s; z-index: 5; }
  #foaie.deschis { transform: translateY(0); }
  #foaieTitlu { font-size: 22px; font-weight: 800; }
  #foaieStare { font-size: 16px; color: var(--muted); margin: 4px 0 12px; }
  #foaieButoane { display: flex; flex-wrap: wrap; gap: 10px; }
  #foaieButoane button { font-size: 18px; font-weight: 700; padding: 14px 20px; background: #e2e8f0; color: var(--text); }
  #foaieButoane button.prim { background: var(--accent); color: #fff; }
  #foaieButoane button.pericol { background: #fee2e2; color: #991b1b; }
  #foaieButoane button.verde { background: var(--ok); color: #fff; }

  #meniu { position: absolute; right: 10px; top: 64px; background: #fff; border-radius: 12px; z-index: 6;
           box-shadow: 0 6px 24px rgba(0,0,0,.25); display: none; flex-direction: column; min-width: 260px; overflow: hidden; }
  #meniu.deschis { display: flex; }
  #meniu button { background: #fff; color: var(--text); text-align: left; border-radius: 0; border-bottom: 1px solid #e2e8f0; }
  #jurnal { position: absolute; left: 10px; right: 10px; top: 64px; bottom: 10px; background: #0b1220; color: #cbd5e1;
            font: 13px/1.35 Consolas, monospace; padding: 10px; overflow: auto; z-index: 7; display: none;
            border-radius: 10px; white-space: pre-wrap; }
  #jurnal.deschis { display: block; }
</style>
</head>
<body>
<div id="bar">
  <span id="titlu">KFB –</span>
  <span id="stareConn" class="pill off">Not connected</span>
  <button id="btnConn">Connect</button>
  <button id="btnPm" disabled>PAIR &amp; MAP: off</button>
  <span id="stareLot" class="pill off" style="display:none"></span>
  <span id="spatiu"></span>
  <button id="btnVal" disabled>VALIDATE</button>
  <button id="btnMeniu" aria-label="Menu">☰</button>
</div>
<div id="banner" class="info">Tap Connect (KFB_VISIO in ESP Setup).</div>
<div id="zona">
  <svg id="desen" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="gol">Tap Connect: the spots come from KFB_VISIO by Bluetooth.<br>
    (KFB_VISIO must be in ESP Setup.)</div>
  <div id="legenda">
    <span><i style="background:#fff;border-style:dashed;border-color:#2563eb"></i>free</span>
    <span><i style="background:#fbbf24"></i>press 3×</span>
    <span><i style="background:#86efac"></i>ready</span>
    <span><i style="background:#22c55e"></i>paired</span>
    <span><i style="background:#94a3b8"></i>offline</span>
    <span><i style="background:#facc15"></i>LOCATE</span>
  </div>
  <button id="btnFit">Fit</button>
  <div id="foaie">
    <div id="foaieTitlu"></div>
    <div id="foaieStare"></div>
    <div id="foaieButoane"></div>
  </div>
</div>
<div id="meniu">
  <button id="mIncarca">Load drawing from a file…</button>
  <button id="mAll">Refresh all spots</button>
  <button id="mLogin">Login (Setup password)…</button>
  <button id="mJurnal">Show / hide log</button>
  <button id="mDeconectare">Disconnect</button>
</div>
<pre id="jurnal"></pre>
<input id="fisier" type="file" accept=".json,application/json" style="display:none">

<script>
"use strict";
// =====================================================================
//  KFB tablet page: PAIR & MAP, Blink, LOCATE, Unpair and Move for the SLAVE boards of one KFB.
//  Bluetooth LE (Nordic UART service) to the MASTER of the KFB; the MASTER relays to KFB_VISIO,
//  which does all the work exactly like the clicks in ESP Setup. The drawing comes from a file
//  exported by KFB_VISIO ("Export drawing for the tablet") and is kept on the tablet.
// =====================================================================
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";   // tablet -> MASTER
const NUS_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";   // MASTER -> tablet
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);

const st = {
  layout: null,            // {kfb, raport, imagine, spoturi:[{n,x,y,d}]}
  spots: new Map(),        // name -> {cod, id, det}
  el: new Map(),           // name -> <g>
  pm: {on: 0, ready: 0, wait: 0, nospot: 0, lot: 0},
  device: null, rx: null, conectat: false, kfbConectat: null,
  ales: null,              // selected spot name
  muta: null,              // {id, from}: waiting for the target spot of a MOVE
  coada: Promise.resolve(),
  rest: "", wakeLock: null, W: 1000, H: 250,
  locuriNoi: null,         // spots arriving by Bluetooth (LY ... LE)
  imgNoua: null,           // drawing arriving by Bluetooth (IMG ... IE)
  vb: {x: 0, y: 0, w: 1000, h: 250},
};

// ---------------------------------------------------------------- log / banner
function jurnal(t) {
  const j = $("jurnal");
  j.textContent += t + "\n";
  if (j.textContent.length > 60000) j.textContent = j.textContent.slice(-40000);
  j.scrollTop = j.scrollHeight;
}
function vibreaza(model) { try { navigator.vibrate && navigator.vibrate(model); } catch (e) {} }
function banner(text, tip = "info") {
  const b = $("banner");
  b.textContent = text;
  b.className = tip;
  if (tip === "ok") vibreaza(80);
  else if (tip === "err") vibreaza([200, 100, 200]);
}

// ---------------------------------------------------------------- drawing (layout)
function salveazaLayout(l) {
  try { localStorage.setItem("kfb_layout_" + l.kfb, JSON.stringify(l)); localStorage.setItem("kfb_ultim", String(l.kfb)); }
  catch (e) { banner("Drawing loaded, but the tablet could not keep it (storage full): load it again next time.", "warn"); }
}
function incarcaLayoutSalvat(kfb) {
  try {
    const k = kfb != null ? kfb : localStorage.getItem("kfb_ultim");
    if (k == null) return null;
    const t = localStorage.getItem("kfb_layout_" + k);
    return t ? JSON.parse(t) : null;
  } catch (e) { return null; }
}
function aplicaLayout(l) {
  st.layout = l;
  st.W = 1000; st.H = 1000 * l.raport;
  $("titlu").textContent = "KFB " + l.kfb;
  $("gol").style.display = "none";
  const svg = $("desen");
  svg.innerHTML = "";
  if (l.imagine) {
    const img = document.createElementNS(SVGNS, "image");
    img.setAttribute("href", l.imagine);
    img.setAttribute("x", 0); img.setAttribute("y", 0);
    img.setAttribute("width", st.W); img.setAttribute("height", st.H);
    svg.appendChild(img);
  } else {                                            // no drawing: white grid
    svg.innerHTML = `<defs><pattern id="grila" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#e2e8f0" stroke-width="1"/></pattern></defs>
      <rect x="0" y="0" width="${st.W}" height="${st.H}" fill="#f8fafc"/>
      <rect x="0" y="0" width="${st.W}" height="${st.H}" fill="url(#grila)"/>`;
  }
  const strat = document.createElementNS(SVGNS, "g");
  strat.id = "spoturi";
  svg.appendChild(strat);
  st.el.clear();
  for (const s of l.spoturi) {
    const g = document.createElementNS(SVGNS, "g");
    g.dataset.n = s.n;
    const r = Math.max(s.d * st.W / 2, 4);
    const c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("class", "c");
    c.setAttribute("cx", s.x * st.W); c.setAttribute("cy", s.y * st.H); c.setAttribute("r", r);
    const tinta = document.createElementNS(SVGNS, "circle");   // bigger invisible touch target
    tinta.setAttribute("cx", s.x * st.W); tinta.setAttribute("cy", s.y * st.H); tinta.setAttribute("r", r * 1.6);
    tinta.setAttribute("fill", "transparent");
    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("class", "nume");
    t.setAttribute("x", s.x * st.W); t.setAttribute("y", s.y * st.H + r + 9);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", 9);
    t.textContent = s.n;
    const id = document.createElementNS(SVGNS, "text");
    id.setAttribute("class", "id");
    id.setAttribute("x", s.x * st.W); id.setAttribute("y", s.y * st.H + 3);
    id.setAttribute("text-anchor", "middle"); id.setAttribute("font-size", Math.max(5, r * 0.9));
    g.append(tinta, c, t, id);
    strat.appendChild(g);
    st.el.set(s.n, g);
    deseneazaSpot(s.n);
  }
  potriveste();
}
function deseneazaSpot(n) {
  const g = st.el.get(n);
  if (!g) return;
  const s = st.spots.get(n) || {cod: "U", id: 0, det: ""};
  g.setAttribute("class", "spot st-" + s.cod + (st.ales === n ? " ales" : ""));
  const idText = g.querySelector("text.id");
  idText.textContent = s.id ? String(s.id) : (s.cod === "W" ? "#" + s.det : s.cod === "R" ? "✓" : "");
}

// ---------------------------------------------------------------- zoom / pan (one finger = move, two = zoom)
function aplicaVb() {
  const v = st.vb;
  $("desen").setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  const zona = $("zona").getBoundingClientRect();
  const pxPeUnitate = zona.width / v.w;
  // names only when zoomed in enough (the drawing has its own labels); without a drawing: always
  $("zona").classList.toggle("ascuns-nume", pxPeUnitate < 1.6 && !(st.layout && (st.layout.fara_desen || !st.layout.imagine)));
}
function potriveste() {
  const z = $("zona").getBoundingClientRect();
  const raport = z.height / z.width;
  let w = st.W, h = st.W * raport;
  if (h < st.H) { h = st.H; w = st.H / raport; }
  st.vb = {x: (st.W - w) / 2, y: (st.H - h) / 2, w, h};
  aplicaVb();
}
const atingeri = new Map();
let gest = null;
function punctSvg(cx, cy) {
  const z = $("zona").getBoundingClientRect(), v = st.vb;
  return {x: v.x + (cx - z.left) / z.width * v.w, y: v.y + (cy - z.top) / z.height * v.h};
}
$("zona").addEventListener("pointerdown", e => {
  if (e.target.closest("#foaie, #btnFit, #legenda")) return;
  $("zona").setPointerCapture(e.pointerId);
  atingeri.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (atingeri.size === 1) gest = {tip: "tap", x0: e.clientX, y0: e.clientY, t0: Date.now(), vb: {...st.vb}, tinta: e.target};
  else if (atingeri.size === 2) {
    const [a, b] = [...atingeri.values()];
    gest = {tip: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y), vb: {...st.vb},
            m: punctSvg((a.x + b.x) / 2, (a.y + b.y) / 2), mc: {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}};
  }
});
$("zona").addEventListener("pointermove", e => {
  if (!atingeri.has(e.pointerId) || !gest) return;
  atingeri.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const z = $("zona").getBoundingClientRect();
  if (gest.tip !== "pinch" && atingeri.size === 1) {
    const dx = e.clientX - gest.x0, dy = e.clientY - gest.y0;
    if (gest.tip === "tap" && Math.hypot(dx, dy) > 10) gest.tip = "pan";
    if (gest.tip === "pan") {
      st.vb.x = gest.vb.x - dx / z.width * gest.vb.w;
      st.vb.y = gest.vb.y - dy / z.height * gest.vb.h;
      aplicaVb();
    }
  } else if (gest.tip === "pinch" && atingeri.size === 2) {
    const [a, b] = [...atingeri.values()];
    let f = gest.d0 / Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));
    const w = Math.min(Math.max(gest.vb.w * f, st.W / 40), st.W * 2);
    f = w / gest.vb.w;
    const h = gest.vb.h * f;
    const mc = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
    st.vb = {w, h,
             x: gest.m.x - (mc.x - z.left) / z.width * w,
             y: gest.m.y - (mc.y - z.top) / z.height * h};
    aplicaVb();
  }
});
function sfarsitAtingere(e) {
  if (!atingeri.has(e.pointerId)) return;
  atingeri.delete(e.pointerId);
  if (gest && gest.tip === "tap" && atingeri.size === 0 && Date.now() - gest.t0 < 600) {
    const g = gest.tinta && gest.tinta.closest ? gest.tinta.closest("g[data-n]") : null;
    if (g) atingeSpot(g.dataset.n); else inchideFoaie();
  }
  if (atingeri.size === 0) gest = null;
  else if (atingeri.size === 1) {
    const [p] = [...atingeri.values()];
    gest = {tip: "pan", x0: p.x, y0: p.y, t0: 0, vb: {...st.vb}};
  }
}
$("zona").addEventListener("pointerup", sfarsitAtingere);
$("zona").addEventListener("pointercancel", sfarsitAtingere);
$("zona").addEventListener("wheel", e => {             // mouse (test on a PC)
  e.preventDefault();
  const m = punctSvg(e.clientX, e.clientY), f = e.deltaY > 0 ? 1.15 : 1 / 1.15;
  const v = st.vb, w = Math.min(Math.max(v.w * f, st.W / 40), st.W * 2), h = v.h * w / v.w;
  st.vb = {w, h, x: m.x - (m.x - v.x) * w / v.w, y: m.y - (m.y - v.y) * h / v.h};
  aplicaVb();
}, {passive: false});
$("btnFit").onclick = () => potriveste();
window.addEventListener("resize", () => aplicaVb());

// ---------------------------------------------------------------- spot sheet (what can be done on a spot)
const TEXT_STARE = {F: "free", W: "waiting: press its board 3×", R: "board placed - VALIDATE to pair it",
                    O: "paired, online", P: "paired, pressed", X: "paired, OFFLINE", N: "paired, not heard yet",
                    L: "LOCATE on", U: "unknown (not connected / not refreshed)"};
function buton(text, cls, fn) {
  const b = document.createElement("button");
  b.textContent = text;
  if (cls) b.className = cls;
  b.onclick = fn;
  $("foaieButoane").appendChild(b);
}
function inchideFoaie() {
  const vechi = st.ales;
  st.ales = null;
  if (vechi) deseneazaSpot(vechi);
  $("foaie").classList.remove("deschis");
}
function atingeSpot(n) {
  const s = st.spots.get(n) || {cod: "U", id: 0, det: ""};
  if (st.muta) {                                      // MOVE: this is the target spot
    const m = st.muta;
    st.muta = null;
    if (n === m.from) { banner("Move cancelled."); return; }
    if (s.cod !== "F") { banner(`"${n}" is not free: move cancelled.`, "err"); return; }
    if (confirm(`Move ID ${m.id} from "${m.from}" to "${n}"?`)) trimite(`MOVE,${m.id},${n}`);
    return;
  }
  const vechi = st.ales;
  st.ales = n;
  if (vechi) deseneazaSpot(vechi);
  deseneazaSpot(n);
  $("foaieTitlu").textContent = n + (s.id ? `  ·  ID ${s.id}` : "");
  $("foaieStare").textContent = TEXT_STARE[s.cod] || s.cod;
  $("foaieButoane").innerHTML = "";
  if (!st.conectat) {
    $("foaieStare").textContent += "  ·  connect first";
  } else if (s.cod === "F") {
    if (st.pm.on) buton(st.pm.nospot ? "Give it to the waiting board" : "SELECT (then press its board 3×)", "prim",
                        () => { trimite(`SELECT,${n}`); inchideFoaie(); });
    else buton("Start PAIR & MAP + SELECT", "prim", () => { trimite("PAIR,START"); trimite(`SELECT,${n}`); inchideFoaie(); });
  } else if (s.cod === "W") {
    buton("Cancel this spot", "", () => { trimite(`UNMAP,${n}`); inchideFoaie(); });
  } else if (s.cod === "R") {
    buton("Blink LED", "prim", () => trimite(`BLINK,${n}`));
    buton("Wrong board: take it off", "pericol", () => { trimite(`UNMAP,${n}`); inchideFoaie(); });
  } else if (s.id) {
    buton("Blink LED", "prim", () => trimite(`BLINK,${s.id}`));
    if (s.cod !== "X") buton(s.cod === "L" ? "LOCATE off" : "LOCATE on", "", () => trimite(`LOCATE,${s.id}`));
    buton("Move to another spot…", "", () => {
      st.muta = {id: s.id, from: n};
      inchideFoaie();
      banner(`Tap the FREE spot where ID ${s.id} goes (tap "${n}" again to cancel).`, "warn");
    });
    buton("Unpair", "pericol", () => {
      if (confirm(`Unpair "${n}" (ID ${s.id})?\nThe board becomes a NEW board.`)) {
        trimite(`UNPAIR,${s.id}`);
        trimite(`UNPAIR,${s.id},YES`);
        inchideFoaie();
      }
    });
  }
  buton("Close", "", inchideFoaie);
  $("foaie").classList.add("deschis");
}

// ---------------------------------------------------------------- lines from KFB_VISIO / MASTER
function actualizeazaBara() {
  const pm = st.pm, b = $("btnPm"), v = $("btnVal");
  b.disabled = !st.conectat;
  b.classList.toggle("on", !!pm.on);
  b.textContent = "PAIR & MAP: " + (pm.on ? "ON" : "off");
  v.disabled = !st.conectat || !pm.on || !pm.ready || !!pm.lot;
  v.textContent = pm.lot ? "Pairing…" : `VALIDATE (${pm.ready})`;
  const l = $("stareLot");
  const parti = [];
  if (pm.on && pm.wait) parti.push(`press 3×: ${pm.wait}`);
  if (pm.on && pm.nospot) parti.push(`waiting for a spot: ${pm.nospot}`);
  l.style.display = parti.length ? "" : "none";
  l.textContent = parti.join("  ·  ");
  l.className = "pill on";
}
function laLinie(linie) {
  jurnal("← " + linie);
  const p = linie.split(",");
  switch (p[0]) {
    case "SP": {
      const nume = p.slice(4).join(",");
      if (p[1] === "-") st.spots.delete(nume);
      else st.spots.set(nume, {cod: p[1], id: parseInt(p[2], 10) || 0, det: p[3] || ""});
      deseneazaSpot(nume);
      if (st.ales === nume && $("foaie").classList.contains("deschis")) atingeSpot(nume);
      return;
    }
    case "PM":
      st.pm = {on: +p[1], ready: +p[2], wait: +p[3], nospot: +p[4], lot: +p[5]};
      actualizeazaBara();
      return;
    case "SYNC": {
      const kfb = parseInt(p[2], 10);
      st.kfbConectat = kfb;
      if (!st.layout || st.layout.kfb !== kfb) {
        const l = incarcaLayoutSalvat(kfb);
        if (l) aplicaLayout(l);
        else banner(`Connected to KFB ${kfb}: waiting for its spots … (☰ → Refresh all spots)`, "warn");
      }
      if (st.layout) {
        const necunoscute = [...st.spots.keys()].filter(n => !st.el.has(n));
        if (necunoscute.length) banner(`${necunoscute.length} spot(s) are not in this drawing: export the drawing again on the PC.`, "warn");
        else banner(`KFB ${kfb}: ${p[1]} spots up to date.`, "ok");
      }
      for (const n of st.el.keys()) deseneazaSpot(n);
      return;
    }
    case "MSG": {
      const t = p.slice(1).join(",");
      banner(t, t.startsWith("✔") ? "ok" : t.startsWith("✕") ? "err" : "warn");
      return;
    }
    case "OK": banner(p.slice(1).join(","), "ok"); return;
    case "ERR": {
      const t = p.slice(1).join(",");
      banner(t, "err");
      if (/LOGIN/.test(t)) cereParola();
      return;
    }
    case "PONG": banner("MASTER answers (" + p.slice(1).join(",") + ")", "ok"); return;
    case "LY":                                        // spots by Bluetooth: header
      if (p[2] === "same") return;
      st.locuriNoi = {hash: p[1], n: +p[2], raport: parseFloat(p[3]), spoturi: []};
      banner(`Receiving ${p[2]} spots from KFB_VISIO …`);
      return;
    case "LS":
      if (st.locuriNoi) st.locuriNoi.spoturi.push({n: p.slice(4).join(","), x: +p[1], y: +p[2], d: +p[3]});
      return;
    case "LE": {
      const ln = st.locuriNoi;
      st.locuriNoi = null;
      if (!ln || ln.hash !== p[1]) return;
      if (ln.spoturi.length !== ln.n) { banner("Spots incomplete: ☰ → Refresh all spots.", "err"); return; }
      const vechi = st.layout;
      const pastreaza = vechi && vechi.imagine && Math.abs(vechi.raport - ln.raport) < 0.01;
      const l = {tip: "kfb-tableta", versiune: 1, kfb: st.kfbConectat || (vechi && vechi.kfb) || 0,
                 creat: new Date().toLocaleString(), raport: pastreaza ? vechi.raport : ln.raport, hash: ln.hash,
                 imagine: pastreaza ? vechi.imagine : "", fara_desen: !pastreaza, spoturi: ln.spoturi};
      salveazaLayout(l);
      aplicaLayout(l);
      banner(`${l.spoturi.length} spots received from KFB_VISIO.`, "ok");
      return;
    }
    case "IMG":                                       // drawing by Bluetooth: header
      st.imgNoua = {n: +p[1], len: +p[2], raport: parseFloat(p[3]), parti: new Array(+p[1]), primite: 0};
      banner("Receiving the drawing: 0 %");
      return;
    case "IB": {
      const im = st.imgNoua, i = +p[1];
      if (!im || i >= im.n) return;
      if (im.parti[i] === undefined) im.primite++;
      im.parti[i] = p.slice(2).join(",");
      if (im.primite % 20 === 0) banner(`Receiving the drawing: ${Math.round(100 * im.primite / im.n)} %`);
      return;
    }
    case "IE": {
      const im = st.imgNoua;
      st.imgNoua = null;
      if (!im) return;
      const b64 = im.parti.join("");
      if (im.primite !== im.n || b64.length !== im.len) {
        banner(`Drawing incomplete (${im.primite} / ${im.n} pieces): send it again from KFB_VISIO.`, "err");
        return;
      }
      const l = Object.assign({}, st.layout || {tip: "kfb-tableta", versiune: 1, kfb: st.kfbConectat || 0, spoturi: []});
      l.imagine = "data:image/jpeg;base64," + b64;
      l.raport = im.raport;
      l.fara_desen = false;
      salveazaLayout(l);
      aplicaLayout(l);
      banner("Drawing received.", "ok");
      return;
    }
  }
  if (linie.startsWith("KFB_VISIO:")) {
    banner(linie.replace("KFB_VISIO: ", ""), "ok");
    const m = linie.match(/KFB (\d+)/);
    if (m) {
      st.kfbConectat = parseInt(m[1], 10);
      if (!st.layout || st.layout.kfb !== st.kfbConectat) {
        const l = incarcaLayoutSalvat(st.kfbConectat);
        if (l) aplicaLayout(l);
      }
    }
    if (/LOGIN/.test(linie)) cereParola();
    else cereTot();
  }
}

// ---------------------------------------------------------------- Bluetooth
const enc = new TextEncoder(), dec = new TextDecoder();
function trimite(linie) {
  jurnal("→ " + linie);
  st.coada = st.coada.then(async () => {
    if (!st.rx) return;
    const b = enc.encode(linie + "\n");
    for (let o = 0; o < b.length; o += 20) {
      const bucata = b.slice(o, o + 20);
      if (st.rx.writeValueWithResponse) await st.rx.writeValueWithResponse(bucata);
      else await st.rx.writeValue(bucata);
    }
  }).catch(e => { jurnal("write error: " + e); banner("Bluetooth write failed: " + e.message, "err"); });
  return st.coada;
}
function laDate(ev) {
  st.rest += dec.decode(ev.target.value, {stream: true});
  const linii = st.rest.split(/\r?\n/);
  st.rest = linii.pop();
  for (const l of linii) if (l.trim()) laLinie(l.trim());
}
async function conectareGatt() {
  banner("Connecting to " + st.device.name + " …");
  const server = await st.device.gatt.connect();
  const svc = await server.getPrimaryService(NUS);
  st.rx = await svc.getCharacteristic(NUS_RX);
  const tx = await svc.getCharacteristic(NUS_TX);
  await tx.startNotifications();
  tx.addEventListener("characteristicvaluechanged", laDate);
  st.conectat = true;
  st.rest = "";
  $("stareConn").textContent = st.device.name;
  $("stareConn").className = "pill on";
  $("btnConn").textContent = "Reconnect";
  actualizeazaBara();
  try { st.wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  // KFB_VISIO greets the tablet; if the greeting was missed, ask for the spots anyway
  setTimeout(() => { if (st.conectat && !st.kfbConectat) cereTot(); }, 2500);
}
async function conecteaza() {
  if (!navigator.bluetooth) {
    banner("This browser has no Bluetooth: use Chrome on the tablet, page opened from https.", "err");
    return;
  }
  try {
    if (!st.device || !st.device.gatt) {
      st.device = await navigator.bluetooth.requestDevice({filters: [{namePrefix: "KFB-"}], optionalServices: [NUS]});
      st.device.addEventListener("gattserverdisconnected", () => {
        st.conectat = false; st.rx = null; st.kfbConectat = null;
        $("stareConn").textContent = "Disconnected"; $("stareConn").className = "pill off";
        actualizeazaBara();
        banner("Disconnected. Tap Reconnect (KFB_VISIO must be in ESP Setup).", "err");
        try { st.wakeLock && st.wakeLock.release(); } catch (e) {}
      });
    }
    await conectareGatt();
  } catch (e) {
    jurnal("connect error: " + e);
    if (String(e).includes("cancelled")) banner("No KFB chosen.");
    else banner("Cannot connect: " + e.message + "  (KFB_VISIO in ESP Setup? Bluetooth + Location on?)", "err");
  }
}
function cereTot() {                                 // spots (only if they changed) + their states
  const ok = st.layout && st.layout.kfb === st.kfbConectat && st.layout.hash;
  trimite("LAYOUT," + (ok ? st.layout.hash : "0"));
  trimite("WATCH");
}
function cereParola() {
  const p = prompt("Setup password of KFB_VISIO:");
  if (p !== null) { trimite("LOGIN," + p); cereTot(); }
}

// ---------------------------------------------------------------- buttons
$("btnConn").onclick = conecteaza;
$("btnPm").onclick = () => {
  if (st.pm.on) {
    if (st.pm.ready && !confirm(`${st.pm.ready} board(s) are placed but NOT validated.\nStop PAIR & MAP and drop them?`)) return;
    trimite(st.pm.ready ? "PAIR,STOP,FORCE" : "PAIR,STOP");
  } else trimite("PAIR,START");
};
$("btnVal").onclick = () => { if (confirm(`Pair the ${st.pm.ready} placed board(s)?`)) trimite("VALIDATE"); };
$("btnMeniu").onclick = () => $("meniu").classList.toggle("deschis");
document.addEventListener("pointerdown", e => {
  if (!e.target.closest("#meniu, #btnMeniu")) $("meniu").classList.remove("deschis");
});
$("mIncarca").onclick = () => { $("meniu").classList.remove("deschis"); $("fisier").click(); };
$("mAll").onclick = () => { $("meniu").classList.remove("deschis"); if (st.conectat) { trimite("LAYOUT,0"); trimite("WATCH"); } };
$("mLogin").onclick = () => { $("meniu").classList.remove("deschis"); cereParola(); };
$("mJurnal").onclick = () => { $("meniu").classList.remove("deschis"); $("jurnal").classList.toggle("deschis"); };
$("jurnal").onclick = () => $("jurnal").classList.remove("deschis");
$("mDeconectare").onclick = () => {
  $("meniu").classList.remove("deschis");
  if (st.device && st.device.gatt && st.device.gatt.connected) st.device.gatt.disconnect();
};
$("fisier").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const l = JSON.parse(r.result);
      if (l.tip !== "kfb-tableta" || !Array.isArray(l.spoturi) || !l.imagine) throw new Error("not a KFB drawing file");
      salveazaLayout(l);
      aplicaLayout(l);
      banner(`Drawing of KFB ${l.kfb} loaded: ${l.spoturi.length} spots (exported ${l.creat}).`, "ok");
      if (st.conectat) cereTot();
    } catch (err) {
      banner("This file cannot be used: " + err.message, "err");
    }
  };
  r.readAsText(f);
};

// ---------------------------------------------------------------- start
const salvat = incarcaLayoutSalvat(null);
if (salvat) { aplicaLayout(salvat); banner(`KFB ${salvat.kfb}: ${salvat.spoturi.length} spots on this tablet. Tap Connect.`); }
actualizeazaBara();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(e => jurnal("offline cache: " + e));
}
</script>
</body>
</html>
